# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: bugtriage-db
    databaseName: bugtriage
    user: bugtriage_user
    plan: free

services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI + ChromaDB + Multi-Agent Engine)
  # -------------------------------------------------------------
  - type: web
    name: bugtriage-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugtriage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ENABLE_LIVE_SELENIUM
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend Web Service (Next.js 14 App Router + Tailwind)
  # -------------------------------------------------------------
  - type: web
    name: bugtriage-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bugtriage-backend
          property: host
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20.12.0"
