version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bugtriage-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: bugtriage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugtriage-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/bugtriage
      - SECRET_KEY=super-secret-bug-triage-jwt-key-2026-production
      - DEMO_MODE=true
      - ENABLE_LIVE_SELENIUM=false
      - CHROMA_PATH=/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend/static:/app/static
      - chroma_data:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bugtriage-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=super-secret-nextauth-token-session-key-2026
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
